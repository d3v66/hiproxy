<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>HiProxy</title>
<style>
  :root { --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #6e6e73; --accent: #007aff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #98989d; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
  main { background: var(--card); border-radius: 20px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.button { display: block; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 600; margin-top: 12px; }
  a.primary { background: var(--accent); color: #fff; }
  a.secondary { color: var(--accent); border: 1px solid var(--accent); }
  small { display: block; margin-top: 20px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>HiProxy</h1>
  <p id="message">Mở link này bằng ứng dụng HiProxy để thêm proxy. Ứng dụng sẽ hỏi xác nhận trước khi lưu.</p>
  <a id="open" class="button primary" href="hiproxy://">Mở bằng HiProxy</a>
  <!-- Replace with the TestFlight / App Store URL when available. -->
  <a id="get" class="button secondary" href="#">Tải HiProxy</a>
  <small>Trang này không gửi dữ liệu nào đi: link chỉ được chuyển sang ứng dụng trên máy của bạn.</small>
</main>
<script>
  // Fallback when the app is not installed (Universal Link not intercepted): rebuild the same
  // request as a hiproxy:// link, entirely client-side. The query is never sent anywhere else.
  (function () {
    var action = location.pathname.replace(/\/+$/, "").split("/").pop() === "import" ? "import" : "add";
    document.getElementById("open").href = "hiproxy://" + action + location.search;
  })();
</script>
</body>
</html>
